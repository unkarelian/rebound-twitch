# Weekly: merge ryanbr/TwitchAdSolutions into upstream-sync/<date>, re-apply the
# Rebound patches and push the branch. The monitor host picks the branch up
# (agent/orchestrate.js, upstreamSync), re-checks it with a live run, and pushes
# it back as verified/upstream-sync-<date>, which auto-pr.yml merges and
# releases. If it does not pass, or the merge conflicts, the agent repairs it.
# Nobody has to merge anything.
name: Upstream sync
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: master, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Merge upstream
        id: merge
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/ryanbr/TwitchAdSolutions.git
          git fetch -q upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then echo "Already up to date."; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          branch="upstream-sync/$(date -u +%F)"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git checkout -b "$branch"
          if ! git merge --no-edit upstream/master; then
            # Keep the conflict in the branch, markers and all: the host's
            # verification fails on it and the agent resolves it there.
            files=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
            git add -A
            git commit -qm "Merge upstream (CONFLICTS, unresolved): $files" --no-verify
          fi
      - if: steps.merge.outputs.skip != '1'
        run: npm ci
        env: { PUPPETEER_SKIP_DOWNLOAD: "1" }
      - name: Re-apply patches and push the branch
        if: steps.merge.outputs.skip != '1'
        run: |
          node tools/apply-rebound-patches.js || true
          if ! git diff --quiet; then git commit -qam "Re-apply Rebound patches after upstream merge"; fi
          git push -q origin "${{ steps.merge.outputs.branch }}"
          echo "Pushed \`${{ steps.merge.outputs.branch }}\`. The monitor host verifies it and it merges itself." >> "$GITHUB_STEP_SUMMARY"
